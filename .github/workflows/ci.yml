name: CI

on:
  push:
    branches: [main, work]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vizaje_staff_test
          POSTGRES_USER: vizaje_test
          POSTGRES_PASSWORD: vizaje_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vizaje_test -d vizaje_staff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://vizaje_test:vizaje_test@127.0.0.1:5432/vizaje_staff_test
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      PHOTO_STORAGE_DRIVER: local
      PHOTO_STORAGE_PATH: ./.data/photos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and HTTP tests
        run: bun test

      - name: PostgreSQL integration tests
        run: RUN_INTEGRATION_TESTS=1 bun test

      - name: Build
        run: bun run build

      - name: Validate Drizzle migrations
        run: bun run --cwd apps/api drizzle-kit check
