services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vizaje_staff}
      POSTGRES_USER: ${POSTGRES_USER:-vizaje}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vizaje}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vizaje} -d ${POSTGRES_DB:-vizaje_staff}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
